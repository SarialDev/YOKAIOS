name: CI

on:
  push:
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-x86 grub-pc-bin grub-common xorriso mtools dosfstools

      - name: Toolchain info
        run: |
          gcc --version | head -1
          qemu-system-x86_64 --version | head -1
          gcc -Q --help=target | grep -E '^\s+-march=|^\s+-mbmi2'

      - name: Build
        run: make

      - name: Test
        run: make test

      - name: Panic tests
        run: make test-smash test-relock

      - name: PCI (q35, ECAM)
        run: make test-pci-q35

      - name: AHCI + block layer (GPT si MBR)
        run: make test-ahci

      - name: FAT32 (mkfs.fat + fsck.fat)
        run: make test-fat32

      - name: Mouse test
        run: make test-mouse

      - name: USB xHCI + HID (fara PS/2)
        run: make test-usb

      - name: Fallback VGA text (nofb)
        run: make test-nofb

      - name: RT jitter test
        continue-on-error: true
        run: make test-rt

      - name: Upload test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-log
          path: build/test.log
          if-no-files-found: ignore
