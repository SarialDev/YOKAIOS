# ypanel (T10.4): aplicatiile din meniul Start si din bara. Linie:  Nume | comanda | optiuni
#   comanda: cale + argumente separate prin spatii (se executa direct); cu | & ; < > $ ghilimele trece prin ysh -c
#   optiuni: pin = aplicatia e ancorata in stanga barei (in ordinea din fisier)
# Meniul Start le arata pe toate, in ordinea de aici (cautarea pune intai numele care incep cu textul scris).
Terminal | /bin/yterm | pin
Ceas | /bin/ywdemo -m clock -t Ceas
Bile | /bin/ywdemo -m balls -t Bile
